name: Build PaperKnife Lite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: "platforms;android-36 build-tools;35.0.0"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 9.3.1
        cache-disabled: true

    # Optional: with no signing secrets the APK is signed with the debug key.
    - name: Decode release keystore
      if: env.SIGNING_KEY != ''
      run: |
        echo "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/keystore.jks"
        echo "KEYSTORE_FILE_PATH=$RUNNER_TEMP/keystore.jks" >> "$GITHUB_ENV"

    - name: Build release APK
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        gradle clean assembleRelease --stacktrace --no-daemon --console=plain
        cp app/build/outputs/apk/release/app-release.apk PaperKnifeLite.apk

    - name: Log APK size
      run: |
        ls -lh PaperKnifeLite.apk
        echo "=== Largest entries ==="
        unzip -l PaperKnifeLite.apk | sort -k1 -n -r | head -25

    - name: Upload release APK
      uses: actions/upload-artifact@v4
      with:
        name: PaperKnifeLite-APK
        path: PaperKnifeLite.apk
